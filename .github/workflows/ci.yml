name: ci

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GITLEAKS_VERSION: 8.30.1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Verify (restore, build, test, format, gitleaks)
        shell: pwsh
        run: ./build/verify.ps1
