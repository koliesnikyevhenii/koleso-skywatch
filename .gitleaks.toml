# gitleaks config for Skywatch (spec C4: no identifying values in git).
# Default rules stay on; custom rules below catch Telegram bot tokens and channel/supergroup ids.

[extend]
useDefault = true

# The default telegram-bot-api-token rule needs the word "telegram" nearby;
# our key is Notifications:BotToken / Notifications__BotToken, so match the bare format too.
[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token (bot id, colon, AA + 33 chars) without a keyword"
regex = '''(?:^|[^0-9])([0-9]{8,10}:AA[A-Za-z0-9_-]{33})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = [":aa"]

[[rules]]
id = "telegram-channel-id"
description = "Telegram marked channel/supergroup id (-100 followed by 10 digits)"
regex = '''(?:^|[^0-9])(-100[0-9]{10})(?:[^0-9]|$)'''
secretGroup = 1
keywords = ["-100"]

# Obviously fake ids for tests and examples: -100 + seven zeros + three digits, e.g. -1000000000001.
# -1001234567890 is the placeholder already committed in docs/source (history cannot be rewritten).
[[rules.allowlists]]
description = "Fake test ids"
regexes = ['''^-1000000000[0-9]{3}$''', '''^-1001234567890$''']
